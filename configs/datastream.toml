# DataStream Configuration

name = "datastream-1"

[log]
level = "info"
format = "json"  # json or console
output = "stdout"  # stdout or file path

[source]
# Source connector configuration
# type = "mysql"
# host = "localhost"
# port = 3306
# user = "root"
# password = ""

[sink]
# Sink connector configuration
# type = "mysql"
# host = "localhost"
# port = 3307
# user = "root"
# password = ""

[pipeline]
batch-size = 1000
parallelism = 4

[pipeline.cache]
max-size = "80%"        # 缓存大小上限：百分比或固定值，如 "100GB", "500MB"
sync = "batch"          # fsync 策略：none (OS管控) / batch (每批fsync) / every (每条事件fsync)
